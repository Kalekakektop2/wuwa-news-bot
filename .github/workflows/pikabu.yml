name: pikabu-dm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r pikabu-bot/requirements.txt
      - name: Check official news and DM admin
        env:
          PIKABU_BOT_TOKEN: ${{ secrets.PIKABU_BOT_TOKEN }}
          PIKABU_ADMIN_ID: ${{ secrets.PIKABU_ADMIN_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_BASE_URL: https://generativelanguage.googleapis.com/v1beta
          PIKABU_STATE: state/pikabu.json
        run: python pikabu-bot/bot.py --once
      - name: Save seen ids
        run: |
          git config user.name "wuwa-pikabu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p state
          git add state/pikabu.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "state: pikabu seen"
            git push
          fi
