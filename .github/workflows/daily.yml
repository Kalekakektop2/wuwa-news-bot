name: wuwa-daily
on:
  schedule:
    - cron: "0 4 * * *"   # 09:00 Екатеринбург
    - cron: "0 16 * * *"  # 21:00 Екатеринбург
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "morning, evening, maintenance or auto"
        required: false
        default: auto
jobs:
  daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post daily content
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_INVITE: ${{ secrets.DISCORD_INVITE }}
          PIKABU_BOT_TOKEN: ${{ secrets.PIKABU_BOT_TOKEN }}
          PIKABU_ADMIN_ID: ${{ secrets.PIKABU_ADMIN_ID }}
          PIKABU_STATE: state/pikabu.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GEMINI_BASE_URL: https://generativelanguage.googleapis.com/v1beta
          DAILY_STATE: state/daily.json
        run: |
          pip install -q -r daily/requirements.txt
          SLOT="${{ github.event.inputs.slot }}"
          CRON="${{ github.event.schedule }}"
          if [ -z "$SLOT" ]; then
            if [ "$CRON" = "20 * * * *" ]; then SLOT=maintenance
            else SLOT=auto
            fi
          fi
          python daily/poster.py --slot "$SLOT"
      - name: Save daily state
        run: |
          git config user.name "wuwa-daily"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p state
          git add state/daily.json state/pikabu.json state/used_art.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "state: daily approval"
            git push
          fi
